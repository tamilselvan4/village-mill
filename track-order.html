<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order | The Village Mill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/ecommerce.css" />
</head>
<body>

  <div id="cursor-glow"></div>
  <div id="cursor-dot"></div>

  <!-- NAVIGATION -->
  <nav id="main-nav" class="scrolled">
    <div class="nav-brand">
      <a href="index.html" class="nav-logo-text">The Village Mill</a>
    </div>
    <ul class="nav-links">
      <li><a href="index.html#our-oils">Our Oils</a></li>
      <li><a href="orders.html">My Orders</a></li>
      <li class="nav-account-slot"><a href="profile.html">👤 Account</a></li>
      <li><a href="cart.html">🛒 Cart (<span class="nav-cart-badge-count">0</span>)</a></li>
    </ul>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="ecom-page">
    <div class="ecom-container" style="max-width: 750px;">
      
      <div class="ecom-title-section">
        <div class="ecom-eyebrow">Real-Time Tracking</div>
        <h1 class="ecom-title">Track Your Package</h1>
        <p class="ecom-subtitle">Enter your order reference number to view live shipment progress.</p>
      </div>

      <div id="track-alert" class="ecom-alert hidden"></div>

      <div class="ecom-card">
        <form id="track-order-form" style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <input type="text" id="track-order-input" class="ecom-input" placeholder="e.g. VM123456" style="flex: 1; min-width: 200px;" required />
          <button type="submit" class="btn-primary">
            <span>Track Order</span>
          </button>
        </form>
      </div>

      <div id="tracking-result-container">
        <!-- Dynamically rendered timeline -->
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer id="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <p class="footer-tagline">Tradition Pressed Into Purity</p>
      </div>
      <div class="footer-bottom">
        <p>© 2026 The Village Mill. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/track-order.js"></script>
  <script src="script.js"></script>
</body>
</html>
